# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseSerialGC -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx1024m -XX:+UseSerialGC -XX:MaxMetaspaceSize=256m

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Suppress AGP compileSdk=35 warning (AGP 8.5 supports API 35)
android.suppressUnsupportedCompileSdk=35

# Proxy configuration
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.local|*.svc|*.cluster.local

