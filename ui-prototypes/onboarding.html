<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>引导页 · 清渡</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .app-container {
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      overflow-y: auto;
    }

    .onboarding-page {
      position: relative;
      z-index: 1;
      padding: 80px 20px 60px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
    }
    .logo-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(90,200,250,0.2), rgba(0,122,255,0.15));
      border: 2px solid rgba(90,200,250,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 40px rgba(90,200,250,0.15);
      margin-bottom: 16px;
    }
    .logo-ring::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.20) 0%, transparent 100%);
      border-radius: 50% 50% 0 0;
      pointer-events: none;
    }
    .logo-text {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--medical-cyan), var(--medical-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Welcome */
    .welcome-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .welcome-subtitle {
      font-size: 15px;
      color: var(--text-400);
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .welcome-desc {
      font-size: 14px;
      color: var(--text-400);
      text-align: center;
      max-width: 260px;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    /* Permission Section */
    .perm-section-title {
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 4px;
    }
    .perm-section-sub {
      font-size: 13px;
      color: var(--text-400);
      text-align: center;
      margin-bottom: 16px;
    }

    .perm-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .perm-card {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 12px;
    }
    .perm-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .perm-icon.notif { background: var(--tint-orange-bg); color: var(--medical-orange); }
    .perm-icon.calendar { background: var(--tint-cyan-bg); color: var(--medical-cyan); }
    .perm-icon.location { background: var(--tint-green-bg); color: var(--medical-green); }
    .perm-info {
      flex: 1;
    }
    .perm-name {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin-bottom: 2px;
    }
    .perm-desc {
      font-size: 12px;
      color: var(--text-400);
    }
    .perm-btn {
      padding: 6px 16px;
      border-radius: 9999px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.08);
      color: var(--fg);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .perm-btn:active { background: rgba(255,255,255,0.14); }
    .perm-btn.granted {
      background: rgba(52,199,89,0.15);
      border-color: rgba(52,199,89,0.3);
      color: var(--medical-green);
    }

    /* Agreement */
    .agreement {
      font-size: 12px;
      color: var(--text-400);
      text-align: center;
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .agreement a {
      color: var(--medical-cyan);
      text-decoration: none;
    }

    /* Start Button */
    .btn-start {
      width: 100%;
      max-width: 280px;
      padding: 14px;
      background: linear-gradient(135deg, var(--medical-cyan), var(--medical-blue), #0064D6);
      border: none;
      border-radius: 9999px;
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: -0.01em;
      transition: opacity 0.15s;
      box-shadow: 0 4px 20px rgba(90,200,250,0.3);
    }
    .btn-start:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="mesh-bg"></div>

    <div class="onboarding-page">
      <!-- Logo -->
      <div class="logo-section">
        <div class="logo-ring">
          <span class="logo-text">清渡</span>
        </div>
      </div>

      <!-- Welcome -->
      <h1 class="welcome-title">清渡 · 透析健康管理</h1>
      <p class="welcome-subtitle">智能透析管理，守护您的每一次治疗</p>
      <p class="welcome-desc">科学记录超滤量、血压、心率、用药等数据，帮助您更好地管理透析生活，让每一天都更安心。</p>

      <!-- Permissions -->
      <div class="perm-section-title">为了更好的体验，请授予以下权限</div>
      <div class="perm-section-sub">部分权限可稍后在设置中开启</div>

      <div class="perm-list">
        <div class="perm-card glass-card">
          <div class="perm-icon notif">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
          </div>
          <div class="perm-info">
            <div class="perm-name">通知权限</div>
            <div class="perm-desc">发送透析提醒和用药提醒</div>
          </div>
          <button class="perm-btn">授权</button>
        </div>

        <div class="perm-card glass-card">
          <div class="perm-icon calendar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </div>
          <div class="perm-info">
            <div class="perm-name">日历权限</div>
            <div class="perm-desc">同步透析日程到系统日历</div>
          </div>
          <button class="perm-btn">授权</button>
        </div>

        <div class="perm-card glass-card">
          <div class="perm-icon location">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <div class="perm-info">
            <div class="perm-name">定位权限</div>
            <div class="perm-desc">导航到透析中心、附近医院定位</div>
          </div>
          <button class="perm-btn">授权</button>
        </div>
      </div>

      <!-- Agreement -->
      <p class="agreement">
        点击即表示您同意<a href="#">《用户协议》</a>和<a href="#">《隐私政策》</a>
      </p>

      <!-- Start -->
      <button class="btn-start">开始使用</button>
    </div>
  </div>
</body>
</html>
