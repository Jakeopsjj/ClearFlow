<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>个人资料 · 清渡</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .app-container {
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    .profile-page {
      position: relative;
      z-index: 1;
      padding: 44px 16px 100px;
      min-height: 100vh;
    }

    .page-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 20px;
      padding-top: 4px;
      height: 32px;
    }
    .back-btn {
      position: absolute;
      left: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--medical-cyan);
      font-size: 17px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .back-btn:hover { opacity: 0.8; }
    .back-arrow {
      width: 20px;
      height: 20px;
    }
    .page-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .section-header {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-400);
      margin-bottom: 8px;
      padding-left: 12px;
    }

    .profile-card {
      margin-bottom: 24px;
    }

    .profile-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .profile-item:active {
      background: rgba(255,255,255,0.04);
    }
    .profile-item + .profile-item {
      border-top: 0.5px solid var(--divider-subtle);
    }

    .item-label {
      font-size: 16px;
      letter-spacing: -0.01em;
      flex: 1;
    }
    .item-label.highlight { color: var(--medical-cyan); }
    .item-value {
      font-size: 15px;
      color: var(--text-400);
      letter-spacing: -0.01em;
    }
    .item-value.highlight { color: var(--medical-cyan); }
    .item-chevron {
      font-size: 18px;
      color: var(--text-400);
      margin-left: 4px;
    }

    /* Avatar Section */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }
    .avatar-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 12px;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--medical-cyan), var(--medical-blue));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 600;
      color: #fff;
    }
    .avatar-edit {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .avatar-edit svg {
      width: 14px;
      height: 14px;
      stroke: #fff;
    }
    .profile-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }
    .patient-id {
      font-size: 14px;
      color: var(--text-400);
    }

    /* Health Info */
    .health-info {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }
    .health-chip {
      flex: 1;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 12px 10px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .health-chip::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, transparent 100%);
      pointer-events: none;
    }
    .health-chip-label {
      font-size: 11px;
      color: var(--text-400);
      margin-bottom: 4px;
    }
    .health-chip-value {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .btn-save {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--medical-cyan), var(--medical-blue));
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: -0.01em;
      margin-top: 32px;
      transition: opacity 0.15s;
    }
    .btn-save:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="mesh-bg"></div>

    <div class="profile-page">
      <!-- Page Nav -->
      <div class="page-nav">
        <a class="back-btn" href="settings.html">
          <svg class="back-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <polyline points="15 6 9 12 15 18"/>
          </svg>
          设置
        </a>
        <span class="page-title">个人资料</span>
      </div>

      <!-- Avatar Section -->
      <div class="avatar-section">
        <div class="avatar-wrapper">
          <div class="avatar">张</div>
          <div class="avatar-edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M17.5 3.5a2.121 2.121 0 0 1 3 3L7 20l-4 1 1-4L17.5 3.5z"/>
            </svg>
          </div>
        </div>
        <div class="profile-name">张先生</div>
        <div class="patient-id">患者ID: P2024001</div>
      </div>

      <!-- 基本信息 -->
      <div class="section-header">基本信息</div>
      <div class="profile-card glass-card">
        <div class="profile-item">
          <span class="item-label">姓名</span>
          <span class="item-value">张先生</span>
          <span class="item-chevron">›</span>
        </div>
        <div class="profile-item">
          <span class="item-label">性别</span>
          <span class="item-value">男</span>
          <span class="item-chevron">›</span>
        </div>
        <div class="profile-item">
          <span class="item-label">出生日期</span>
          <span class="item-value">1975-03-15（51岁）</span>
          <span class="item-chevron">›</span>
        </div>
        <div class="profile-item">
          <span class="item-label">身高</span>
          <span class="item-value">172 cm</span>
          <span class="item-chevron">›</span>
        </div>
        <div class="profile-item">
          <span class="item-label highlight">干体重</span>
          <span class="item-value highlight">65.0 kg</span>
          <span class="item-chevron">›</span>
        </div>
        <div class="profile-item">
          <span class="item-label">血型</span>
          <span class="item-value">O型 Rh阳性</span>
          <span class="item-chevron">›</span>
        </div>
        <div class="profile-item">
          <span class="item-label">患者ID</span>
          <span class="item-value">P2024001</span>
          <span class="item-chevron">›</span>
        </div>
      </div>

      <!-- 透析信息 -->
      <div class="section-header">透析信息</div>
      <div class="profile-card glass-card">
        <div class="profile-item">
          <span class="item-label">透析类型</span>
          <span class="item-value">血液透析</span>
          <span class="item-chevron">›</span>
        </div>
        <div class="profile-item">
          <span class="item-label">首次透析日期</span>
          <span class="item-value">2023-06-01</span>
          <span class="item-chevron">›</span>
        </div>
        <div class="profile-item">
          <span class="item-label">透析龄</span>
          <span class="item-value">3年2个月</span>
        </div>
        <div class="profile-item">
          <span class="item-label">血管通路</span>
          <span class="item-value">动静脉内瘘</span>
          <span class="item-chevron">›</span>
        </div>
        <div class="profile-item">
          <span class="item-label">透析医院</span>
          <span class="item-value">市第一人民医院</span>
          <span class="item-chevron">›</span>
        </div>
        <div class="profile-item">
          <span class="item-label">透析计划</span>
          <span class="item-value">每周一三五 · 08:00</span>
          <span class="item-chevron">›</span>
        </div>
      </div>

      <!-- 健康信息 -->
      <div class="section-header">健康概览</div>
      <div class="health-info">
        <div class="health-chip">
          <div class="health-chip-label">透析类型</div>
          <div class="health-chip-value">血液透析</div>
        </div>
        <div class="health-chip">
          <div class="health-chip-label">干体重</div>
          <div class="health-chip-value">65.0 kg</div>
        </div>
        <div class="health-chip">
          <div class="health-chip-label">透析频率</div>
          <div class="health-chip-value">每周3次</div>
        </div>
      </div>

      <!-- 紧急联系 -->
      <div class="section-header">紧急联系</div>
      <div class="profile-card glass-card">
        <div class="profile-item" style="padding: 14px 16px;">
          <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--tint-cyan-bg); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: var(--medical-cyan); margin-right: 12px; flex-shrink: 0;">张</div>
          <div style="flex: 1;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 2px;">
              <span style="font-size: 16px; font-weight: 500; letter-spacing: -0.01em;">张女士</span>
              <span style="font-size: 13px; color: var(--text-400);">配偶</span>
            </div>
            <div style="font-size: 14px; color: var(--medical-cyan); letter-spacing: -0.01em;">138-1234-5678</div>
          </div>
          <button style="width: 36px; height: 36px; border-radius: 50%; background: var(--tint-green-bg); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--medical-green)" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn-save">保存修改</button>
    </div>

    <!-- Navigation Bar -->
    <nav class="nav-bar">
      <div class="nav-item">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-400)" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div class="nav-dot"></div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-400)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="nav-dot"></div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-400)" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </div>
        <div class="nav-dot"></div>
      </div>
      <div class="nav-item active">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--nav-indicator)" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </div>
        <div class="nav-dot"></div>
      </div>
    </nav>
  </div>
</body>
</html>
