<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>通知管理 · 清渡</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .app-container {
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    .notif-page {
      position: relative;
      z-index: 1;
      padding: 44px 16px 100px;
      min-height: 100vh;
    }

    .page-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 20px;
      padding-top: 4px;
      height: 32px;
    }
    .back-btn {
      position: absolute;
      left: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--medical-cyan);
      font-size: 17px;
      cursor: pointer;
      text-decoration: none;
    }
    .back-arrow { width: 20px; height: 20px; }
    .page-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .section-header {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-400);
      margin-bottom: 8px;
      padding-left: 12px;
    }

    .notif-card {
      margin-bottom: 24px;
    }

    /* Strong Reminder Card */
    .strong-card {
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--tint-orange-bg) !important;
      border: 1px solid rgba(255,149,0,0.3) !important;
      box-shadow: 0 4px 16px rgba(255,149,0,0.15);
    }
    .strong-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }
    .strong-info {
      flex: 1;
    }
    .strong-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 2px;
    }
    .strong-desc {
      font-size: 13px;
      color: var(--text-400);
      line-height: 18px;
    }

    /* Toggle Item */
    .toggle-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
    }
    .toggle-item + .toggle-item {
      border-top: 0.5px solid var(--divider-subtle);
    }
    .toggle-info {
      flex: 1;
    }
    .toggle-label {
      font-size: 16px;
      letter-spacing: -0.01em;
    }
    .toggle-label.warning { color: var(--medical-red); }
    .toggle-sub {
      font-size: 13px;
      color: var(--text-400);
      margin-top: 1px;
    }
    .toggle-sub.warning { color: rgba(255,59,48,0.7); }
    .toggle-sub.accent { color: var(--medical-orange); }

    /* iOS Toggle */
    .ios-toggle {
      width: 51px;
      height: 31px;
      border-radius: 9999px;
      background: rgba(120,120,128,0.32);
      cursor: pointer;
      position: relative;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .ios-toggle.on {
      background: var(--medical-green);
    }
    .ios-toggle .thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
      transition: left 0.3s;
    }
    .ios-toggle.on .thumb {
      left: 22px;
    }

    /* Nav Item */
    .nav-item-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .nav-item-row:active {
      background: rgba(255,255,255,0.04);
    }
    .nav-item-row + .nav-item-row {
      border-top: 0.5px solid var(--divider-subtle);
    }
    .nav-item-label {
      flex: 1;
      font-size: 16px;
      letter-spacing: -0.01em;
    }
    .nav-item-value {
      font-size: 15px;
      color: var(--text-400);
      margin-right: 4px;
    }
    .nav-item-chevron {
      font-size: 18px;
      color: var(--text-400);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="mesh-bg"></div>

    <div class="notif-page">
      <!-- Page Nav -->
      <div class="page-nav">
        <a class="back-btn" href="settings.html">
          <svg class="back-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <polyline points="15 6 9 12 15 18"/>
          </svg>
          设置
        </a>
        <span class="page-title">通知管理</span>
      </div>

      <!-- Strong Reminder Card -->
      <div class="notif-card glass-card strong-card">
        <div class="strong-icon">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="var(--medical-orange)" stroke-width="2.2">
            <path d="M10 26 L10 18 A10 6 0 0 1 30 18 L30 26"/>
            <line x1="7.5" y1="30" x2="32.5" y2="30"/>
            <line x1="20" y1="31" x2="20" y2="35"/>
            <circle cx="20" cy="36.5" r="1.5"/>
            <line x1="14" y1="9" x2="14" y2="5"/>
            <line x1="26" y1="9" x2="26" y2="5"/>
          </svg>
        </div>
        <div class="strong-info">
          <div class="strong-title">强提醒模式</div>
          <div class="strong-desc">在锁屏和后台状态下全屏弹窗提醒您按时服药和透析</div>
        </div>
        <div class="ios-toggle on" onclick="this.classList.toggle('on')">
          <div class="thumb"></div>
        </div>
      </div>

      <!-- 用药提醒 -->
      <div class="section-header" style="margin-top: 24px;">用药提醒</div>
      <div class="notif-card glass-card">
        <div class="toggle-item">
          <div class="toggle-info">
            <div class="toggle-label">用药提醒</div>
            <div class="toggle-sub">每日服药时间提醒</div>
          </div>
          <div class="ios-toggle on" onclick="this.classList.toggle('on')">
            <div class="thumb"></div>
          </div>
        </div>
      </div>

      <!-- 透析提醒 -->
      <div class="section-header">透析提醒</div>
      <div class="notif-card glass-card">
        <div class="toggle-item">
          <div class="toggle-info">
            <div class="toggle-label">透析提醒</div>
            <div class="toggle-sub">透析日前一天晚间提醒</div>
          </div>
          <div class="ios-toggle on" onclick="this.classList.toggle('on')">
            <div class="thumb"></div>
          </div>
        </div>
      </div>

      <!-- 异常提醒 -->
      <div class="section-header">异常提醒</div>
      <div class="notif-card glass-card">
        <div class="toggle-item">
          <div class="toggle-info">
            <div class="toggle-label warning">异常提醒</div>
            <div class="toggle-sub warning">体重、血压等指标异常时及时通知</div>
          </div>
          <div class="ios-toggle on" onclick="this.classList.toggle('on')">
            <div class="thumb"></div>
          </div>
        </div>
      </div>

      <!-- 健康周报 -->
      <div class="section-header">健康周报</div>
      <div class="notif-card glass-card">
        <div class="toggle-item">
          <div class="toggle-info">
            <div class="toggle-label">健康周报</div>
            <div class="toggle-sub">每周生成健康数据总结报告</div>
          </div>
          <div class="ios-toggle" onclick="this.classList.toggle('on')">
            <div class="thumb"></div>
          </div>
        </div>
      </div>

      <!-- 提醒方式 -->
      <div class="section-header">提醒方式</div>
      <div class="notif-card glass-card">
        <div class="nav-item-row">
          <span class="nav-item-label">声音提醒</span>
          <span class="nav-item-value">默认铃声</span>
          <span class="nav-item-chevron">›</span>
        </div>
        <div class="toggle-item">
          <div class="toggle-label">震动提醒</div>
          <div class="ios-toggle on" onclick="this.classList.toggle('on')">
            <div class="thumb"></div>
          </div>
        </div>
        <div class="toggle-item">
          <div>
            <div class="toggle-label">锁屏弹窗</div>
            <div class="toggle-sub accent">强提醒</div>
          </div>
          <div class="ios-toggle on" onclick="this.classList.toggle('on')">
            <div class="thumb"></div>
          </div>
        </div>
        <div class="nav-item-row">
          <span class="nav-item-label">提醒时段</span>
          <span class="nav-item-value">全天</span>
          <span class="nav-item-chevron">›</span>
        </div>
      </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="nav-bar">
      <div class="nav-item">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-400)" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div class="nav-dot"></div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-400)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="nav-dot"></div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-400)" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </div>
        <div class="nav-dot"></div>
      </div>
      <div class="nav-item active">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--nav-indicator)" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </div>
        <div class="nav-dot"></div>
      </div>
    </nav>
  </div>
</body>
</html>
