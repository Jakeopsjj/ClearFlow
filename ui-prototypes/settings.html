<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>设置 · 清渡</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .app-container {
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    .settings-page {
      position: relative;
      z-index: 1;
      padding: 44px 16px 100px;
      min-height: 100vh;
    }

    .page-header {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
      padding-top: 4px;
    }

    .section-header {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-400);
      margin-bottom: 8px;
      padding-left: 12px;
      text-transform: none;
    }

    .settings-card {
      margin-bottom: 24px;
    }

    .settings-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .settings-item:active {
      background: rgba(255,255,255,0.04);
    }
    .settings-item + .settings-item {
      border-top: 0.5px solid var(--divider-subtle);
    }

    .item-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }
    .item-icon.profile { background: var(--tint-cyan-bg); color: var(--medical-cyan); }
    .item-icon.reminder { background: var(--tint-orange-bg); color: var(--medical-orange); }
    .item-icon.backup { background: var(--tint-green-bg); color: var(--medical-green); }
    .item-icon.notification { background: var(--tint-blue-bg); color: var(--medical-blue); }
    .item-icon.about { background: rgba(255,255,255,0.08); color: var(--text-400); }
    .item-icon.cache { background: var(--tint-red-bg); color: var(--medical-red); }
    .item-icon.logout { color: var(--medical-red); }

    .item-content {
      flex: 1;
      margin-left: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .item-label {
      font-size: 16px;
      letter-spacing: -0.01em;
    }
    .item-label.danger { color: var(--medical-red); }
    .item-value {
      font-size: 15px;
      color: var(--text-400);
      margin-right: 4px;
    }
    .item-value.danger { color: var(--medical-red); }
    .item-chevron {
      font-size: 18px;
      color: var(--text-400);
      opacity: 0.6;
    }

    .logout-item {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 16px;
      cursor: pointer;
      font-size: 16px;
      color: var(--medical-red);
      letter-spacing: -0.01em;
    }

    /* Icon SVGs */
    .icon-svg {
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="mesh-bg"></div>

    <div class="settings-page">
      <h1 class="page-header">设置</h1>

      <!-- 通用 -->
      <div class="section-header">通用</div>
      <div class="settings-card glass-card">
        <div class="settings-item">
          <div class="item-icon profile">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
          </div>
          <div class="item-content">
            <span class="item-label">个人资料</span>
            <span class="item-chevron">›</span>
          </div>
        </div>

        <div class="settings-item">
          <div class="item-icon reminder">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <div class="item-content">
            <span class="item-label">提醒设置</span>
            <span class="item-chevron">›</span>
          </div>
        </div>
      </div>

      <!-- 数据与隐私 -->
      <div class="section-header">数据与隐私</div>
      <div class="settings-card glass-card">
        <div class="settings-item">
          <div class="item-icon backup">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          </div>
          <div class="item-content">
            <span class="item-label">数据备份</span>
            <span class="item-chevron">›</span>
          </div>
        </div>

        <div class="settings-item">
          <div class="item-icon notification">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <div class="item-content">
            <span class="item-label">通知管理</span>
            <span class="item-chevron">›</span>
          </div>
        </div>
      </div>

      <!-- 关于 -->
      <div class="section-header">关于</div>
      <div class="settings-card glass-card">
        <div class="settings-item">
          <div class="item-icon about">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </div>
          <div class="item-content">
            <span class="item-label">关于清渡</span>
            <span class="item-chevron">›</span>
          </div>
        </div>
      </div>

      <!-- 危险操作 -->
      <div class="settings-card glass-card" style="margin-bottom: 12px;">
        <div class="settings-item">
          <div class="item-icon cache">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </div>
          <div class="item-content">
            <span class="item-label danger">清除缓存</span>
            <span class="item-value danger">2.3 MB</span>
          </div>
        </div>
      </div>

      <div class="settings-card glass-card">
        <div class="logout-item">退出登录</div>
      </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="nav-bar">
      <div class="nav-item">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-400)" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div class="nav-dot"></div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-400)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="nav-dot"></div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-400)" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </div>
        <div class="nav-dot"></div>
      </div>
      <div class="nav-item active">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--nav-indicator)" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </div>
        <div class="nav-dot"></div>
      </div>
    </nav>
  </div>
</body>
</html>
