<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>透析管家 - 健康数据</title>
    <style id="theme-vars">
/*
 * DialysisCare - Liquid Glass Theme
 * Brand: DialysisCare (透析管家)
 * Domain: Medical health / Dialysis patient management
 * Style: iOS 27 Liquid Glass, dark-first, translucent materials
 * Theme mode: dark-first with light support
 *
 * Visual language:
 *   - Mesh gradient backgrounds with medical blues/cyans
 *   - Liquid Glass translucent surfaces with backdrop blur
 *   - Specular highlight edges on glass cards
 *   - Floating pill navigation bar
 *   - Circular/ring progress for health metrics
 *   - Spring-based motion
 */

:root {
  /* ===== APPLE SYSTEM PRIMITIVES (base) ===== */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff;
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* ===== MEDICAL EXTENSION COLORS ===== */
  --medical-cyan: #5ac8fa;
  --medical-teal: #30b0c7;
  --medical-blue: #007aff;
  --medical-green: #34c759;
  --medical-red: #ff3b30;
  --medical-orange: #ff9500;
  --medical-purple: #af52de;
  --medical-pink: #ff2d55;
  --medical-yellow: #ffcc00;
  --medical-indigo: #5856d6;

  /* Vital-specific colors */
  --bp-normal: #34c759;
  --bp-elevated: #ffcc00;
  --bp-high: #ff9500;
  --bp-crisis: #ff3b30;
  --hr-normal: #30d158;
  --hr-elevated: #ff9f0a;
  --hr-danger: #ff453a;
  --fluid-good: #5ac8fa;
  --fluid-warning: #ff9f0a;
  --fluid-danger: #ff453a;
  --k-normal: #30d158;
  --k-high: #ff453a;
  --p-normal: #30d158;
  --p-high: #ff9f0a;

  /* ===== LIQUID GLASS MATERIALS ===== */
  --glass-bg: rgba(255, 255, 255, 0.12);
  --glass-bg-strong: rgba(255, 255, 255, 0.18);
  --glass-bg-light: rgba(255, 255, 255, 0.08);
  --glass-border: rgba(255, 255, 255, 0.22);
  --glass-border-subtle: rgba(255, 255, 255, 0.12);
  --glass-highlight: rgba(255, 255, 255, 0.35);
  --glass-shadow: rgba(0, 0, 0, 0.25);
  --glass-strong-shadow: rgba(0, 0, 0, 0.4);
  --glass-blur: 30px;
  --glass-blur-strong: 40px;
  --glass-blur-light: 20px;
  --glass-saturate: 1.8;
  --glass-inner-highlight: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%);
  --glass-specular: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.05) 40%, rgba(255,255,255,0) 100%);

  /* ===== SEMANTIC ROLES (Dark-first) ===== */
  --background: #000000;
  --foreground: #f5f5f7;
  --card: rgba(28, 28, 30, 0.6);
  --card-foreground: #f5f5f7;
  --popover: rgba(58, 58, 60, 0.7);
  --popover-foreground: #f5f5f7;

  --primary: var(--medical-cyan);
  --primary-foreground: #ffffff;
  --secondary: rgba(255, 255, 255, 0.1);
  --secondary-foreground: #f5f5f7;
  --muted: rgba(255, 255, 255, 0.06);
  --muted-foreground: #8e8e93;
  --accent: var(--medical-blue);
  --accent-foreground: #ffffff;
  --destructive: var(--medical-red);
  --destructive-foreground: #ffffff;
  --success: var(--medical-green);
  --success-foreground: #ffffff;
  --warning: var(--medical-orange);
  --warning-foreground: #ffffff;
  --border: rgba(255, 255, 255, 0.15);
  --input: rgba(255, 255, 255, 0.1);
  --ring: var(--medical-cyan);

  --icon: #f5f5f7;
  --icon-muted: #8e8e93;

  --chart-1: var(--medical-green);
  --chart-2: var(--medical-cyan);
  --chart-3: var(--medical-orange);
  --chart-4: var(--medical-indigo);
  --chart-5: var(--medical-purple);

  --sidebar: rgba(28, 28, 30, 0.8);
  --sidebar-foreground: #f5f5f7;
  --sidebar-primary: var(--medical-cyan);
  --sidebar-primary-foreground: #000000;
  --sidebar-accent: rgba(255, 255, 255, 0.1);
  --sidebar-accent-foreground: #f5f5f7;
  --sidebar-border: rgba(255, 255, 255, 0.1);
  --sidebar-ring: var(--medical-cyan);

  /* ===== TYPOGRAPHY ===== */
  --font-sans: -apple-system, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', system-ui, sans-serif;
  --font-serif: -apple-system, 'SF Pro Display', 'PingFang SC', system-ui, sans-serif;
  --font-mono: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace;
  --tracking-normal: -0.01em;
  --tracking-tight: -0.03em;

  /* ===== RADIUS (Liquid Glass uses larger, smoother radii) ===== */
  --radius: 1.5rem;
  --radius-sm: 0.75rem;
  --radius-md: 1rem;
  --radius-lg: 1.5rem;
  --radius-xl: 2rem;
  --radius-2xl: 2.5rem;
  --radius-full: 9999px;

  /* ===== SPACING ===== */
  --spacing: 0.25rem;

  /* ===== SHADOWS (enhanced for depth under glass) ===== */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.3);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.4), 0 1px 2px -1px rgba(0, 0, 0, 0.3);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
  --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  --shadow-2xl: 0 35px 60px -15px rgba(0, 0, 0, 0.6);

  /* ===== GLOW EFFECTS ===== */
  --glow-cyan: 0 0 30px rgba(90, 200, 250, 0.3);
  --glow-blue: 0 0 30px rgba(0, 122, 255, 0.3);
  --glow-green: 0 0 20px rgba(52, 199, 89, 0.25);
  --glow-red: 0 0 20px rgba(255, 59, 48, 0.3);
  --glow-orange: 0 0 20px rgba(255, 149, 0, 0.25);

  /* ===== DEVICE FRAME ===== */
  --device-outer-bg: #1a1a1a;
  --device-frame-start: #2c2c2e;
  --device-frame-mid: #1c1c1e;
  --device-frame-end: #0d0d0d;
  --device-frame-border: rgba(255, 255, 255, 0.12);
  --device-frame-shadow1: rgba(0, 0, 0, 0.5);
  --device-frame-shadow2: rgba(0, 0, 0, 0.6);
  --device-frame-shadow3: rgba(0, 0, 0, 0.4);
  --device-frame-inner-highlight: rgba(255, 255, 255, 0.08);
  --device-metallic-highlight: rgba(255, 255, 255, 0.15);
  --device-metallic-mid: rgba(255, 255, 255, 0.02);
  --dynamic-island-bg: #000;
  --home-indicator: rgba(255, 255, 255, 0.3);

  /* ===== STATUS BAR ICONS ===== */
  --signal-bars-color: #f5f5f7;
  --wifi-color: #f5f5f7;
  --battery-border: rgba(255, 255, 255, 0.6);
  --battery-cap: rgba(255, 255, 255, 0.6);
  --battery-level: #f5f5f7;

  /* ===== MESH GRADIENT COLORS ===== */
  --mesh-purple: rgba(88, 86, 214, 0.4);
  --mesh-cyan: rgba(90, 200, 250, 0.25);
  --mesh-deep-purple: rgba(175, 82, 222, 0.2);
  --mesh-blue: rgba(0, 122, 255, 0.2);
  --mesh-additional1: rgba(52, 199, 89, 0.15);
  --mesh-additional2: rgba(255, 149, 0, 0.1);

  /* ===== GLASS INNER HIGHLIGHTS ===== */
  --glass-edge-highlight: rgba(255, 255, 255, 0.4);
  --glass-edge-highlight-end: rgba(255, 255, 255, 0);
  --glass-specular-top: rgba(255, 255, 255, 0.25);
  --glass-specular-mid: rgba(255, 255, 255, 0.05);

  /* ===== DIVIDER & SEPARATOR ===== */
  --divider-subtle: rgba(255, 255, 255, 0.06);
  --divider-light: rgba(255, 255, 255, 0.08);
  --divider-medium: rgba(255, 255, 255, 0.1);

  /* ===== CHART/GRAPH COLORS ===== */
  --chart-grid: rgba(255, 255, 255, 0.08);
  --chart-target-line: rgba(255, 149, 0, 0.6);
  --chart-fill-start: rgba(90, 200, 250, 0.3);
  --chart-fill-end: rgba(90, 200, 250, 0);

  /* ===== NUMERIC KEYPAD ===== */
  --keypad-btn-bg: rgba(255, 255, 255, 0.08);
  --keypad-btn-active: rgba(255, 255, 255, 0.2);
  --keypad-btn-text: #f5f5f7;

  /* ===== ON/OFF TOGGLE ===== */
  --toggle-off: rgba(120, 120, 128, 0.32);
  --toggle-thumb: #fff;

  /* ===== TAB/SEGMENT CONTROL ===== */
  --segment-bg: rgba(255, 255, 255, 0.08);
  --segment-active: rgba(255, 255, 255, 0.18);
  --segment-inactive-text: rgba(255, 255, 255, 0.6);

  /* ===== PROGRESS/TRACK COLORS ===== */
  --track-bg: rgba(255, 255, 255, 0.1);
  --track-fill: var(--primary);

  /* ===== FAB ADD BUTTON ===== */
  --fab-bg-start: #5ac8fa;
  --fab-bg-end: #007aff;

  /* ===== ALERT/WARNING BANNER ===== */
  --alert-orange-bg: rgba(255, 149, 0, 0.15);
  --alert-orange-border: rgba(255, 149, 0, 0.3);
  --alert-red-bg: rgba(255, 59, 48, 0.15);
  --alert-red-border: rgba(255, 59, 48, 0.3);

  /* ===== SHADOW VARIABLES ===== */
  --shadow-xs-rgba: rgba(0, 0, 0, 0.3);
  --shadow-sm-rgba: rgba(0, 0, 0, 0.35);

  /* ===== TINTED BACKGROUNDS (colored glass tints) ===== */
  --tint-cyan-light: rgba(90, 200, 250, 0.1);
  --tint-cyan-bg: rgba(90, 200, 250, 0.15);
  --tint-cyan-md: rgba(90, 200, 250, 0.2);
  --tint-cyan-strong: rgba(90, 200, 250, 0.25);
  --tint-cyan-border: rgba(90, 200, 250, 0.3);
  --tint-cyan-active: rgba(90, 200, 250, 0.35);
  --tint-cyan-glow: rgba(90, 200, 250, 0.4);
  --tint-cyan-glow-strong: rgba(90, 200, 250, 0.5);
  --tint-cyan-bar: rgba(90, 200, 250, 0.6);

  --tint-blue-bg: rgba(0, 122, 255, 0.12);
  --tint-blue-glow: rgba(0, 122, 255, 0.3);
  --tint-blue-glow-strong: rgba(0, 122, 255, 0.5);
  --tint-blue-shadow: rgba(0, 122, 255, 0.3);

  --tint-red-bg: rgba(255, 59, 48, 0.12);
  --tint-red-strong: rgba(255, 59, 48, 0.18);
  --tint-red-border: rgba(255, 59, 48, 0.3);
  --tint-red-shadow: rgba(255, 59, 48, 0.2);
  --tint-red-glow: rgba(255, 59, 48, 0.3);
  --tint-red-glow-strong: rgba(255, 59, 48, 0.4);
  --tint-red-btn: rgba(255, 59, 48, 0.15);
  --tint-red-light: #ff6b60;

  --tint-green-bg: rgba(52, 199, 89, 0.12);
  --tint-green-strong: rgba(52, 199, 89, 0.15);
  --tint-green-border: rgba(52, 199, 89, 0.2);
  --tint-green-glow: rgba(52, 199, 89, 0.4);
  --tint-green-glow-strong: rgba(52, 199, 89, 0.5);
  --tint-green-bar-start: rgba(52, 199, 89, 0.3);
  --tint-green-bar-end: rgba(52, 199, 89, 0.6);

  --tint-orange-bg: rgba(255, 149, 0, 0.12);
  --tint-orange-icon: rgba(255, 149, 0, 0.2);
  --tint-orange-btn: rgba(255, 149, 0, 0.25);
  --tint-orange-border: rgba(255, 149, 0, 0.35);
  --tint-orange-border-strong: rgba(255, 149, 0, 0.4);
  --tint-orange-glow: rgba(255, 149, 0, 0.15);
  --tint-orange-text: rgba(255, 149, 0, 0.7);
  --tint-orange-active: rgba(255, 149, 0, 0.4);
  --tint-orange-bar-start: rgba(255, 149, 0, 0.3);
  --tint-orange-glow-dot: rgba(255, 149, 0, 0.5);

  --tint-purple-bg: rgba(175, 82, 222, 0.15);

  --tint-indigo-bg: rgba(88, 86, 214, 0.15);

  /* ===== GLASS SPECULAR MID ===== */
  --glass-specular-mid-low: rgba(255, 255, 255, 0.03);

  /* ===== CARD ACTIVE STATE ===== */
  --card-active-bg: rgba(255, 255, 255, 0.16);

  /* ===== KEY ACTIVE STATE ===== */
  --key-active-bg: rgba(255, 255, 255, 0.22);

  /* ===== BATTERY BORDER (slightly off-white) ===== */
  --battery-border-inner: rgba(245, 245, 247, 0.5);

  /* ===== PLACEHOLDER TEXT ===== */
  --placeholder-text: rgba(245, 245, 247, 0.35);
  --placeholder-input: rgba(142, 142, 147, 0.6);
  --placeholder-input-strong: rgba(142, 142, 147, 0.7);

  /* ===== SEGMENT INDICATOR COLORS ===== */
  --seg-indicator-start: rgba(90, 200, 250, 0.35);
  --seg-indicator-end: rgba(0, 122, 255, 0.3);
  --seg-indicator-border: rgba(90, 200, 250, 0.4);
  --seg-indicator-shadow: rgba(90, 200, 250, 0.2);

  /* ===== UPCOMING DOT COLORS ===== */
  --dot-upcoming-bg: rgba(255, 255, 255, 0.3);
  --dot-upcoming-border: rgba(255, 255, 255, 0.5);
  --dot-optional-bg: rgba(255, 255, 255, 0.15);
  --dot-optional-border: rgba(255, 255, 255, 0.3);
  --divider-dot: rgba(255, 255, 255, 0.2);

  /* ===== EMPTY CIRCLE ===== */
  --circle-empty-border: rgba(255, 255, 255, 0.2);
  --circle-empty-bg: rgba(255, 255, 255, 0.05);

  /* ===== TEXT SECONDARY LINK ===== */
  --text-link-secondary: rgba(255, 255, 255, 0.7);

  /* ===== FAB COLORS ===== */
  --fab-bg: rgba(90, 200, 250, 0.3);
  --fab-border: rgba(90, 200, 250, 0.4);
  --fab-shadow1: rgba(90, 200, 250, 0.25);
  --fab-shadow2: rgba(90, 200, 250, 0.2);
  --fab-specular: rgba(255, 255, 255, 0.2);

  /* ===== SAVE BUTTON GLOW ===== */
  --btn-glow-cyan: rgba(90, 200, 250, 0.35);
  --btn-glow-blue: rgba(0, 122, 255, 0.3);
  --btn-glow-cyan-active: rgba(90, 200, 250, 0.25);
  --btn-glow-blue-active: rgba(0, 122, 255, 0.2);

  /* ===== MESH ADDITIONAL TINT ===== */
  --mesh-cyan-extra: rgba(90, 200, 250, 0.1);

  /* ===== RED TINT EXTENSIONS ===== */
  --tint-red-highlight: rgba(255, 255, 255, 0.2);
  --tint-red-shadow-md: rgba(255, 59, 48, 0.3);
  --tint-red-shadow-strong: rgba(255, 59, 48, 0.4);
  --destructive-light: #ff6b60;

  /* ===== BLUE TINT STRONG ===== */
  --tint-blue-strong: rgba(0, 122, 255, 0.12);

  /* ===== GLASS CARD HOVER/ACTIVE ===== */
  --glass-card-hover: rgba(255, 255, 255, 0.16);

  /* ===== TEXT 600 (secondary text in dark mode) ===== */
  --text-600: rgba(255, 255, 255, 0.7);

  /* ===== ANIMATION GLOW COLORS (bare rgba for @keyframes use) ===== */
  --glow-cyan-soft: rgba(90, 200, 250, 0.2);
  --glow-cyan-mid: rgba(90, 200, 250, 0.25);
  --glow-cyan-strong: rgba(90, 200, 250, 0.4);
  --glow-cyan-stronger: rgba(90, 200, 250, 0.5);
  --glow-cyan-max: rgba(90, 200, 250, 0.7);
  --glow-cyan-text: rgba(90, 200, 250, 0.3);
  --glow-red-soft: rgba(255, 59, 48, 0.1);
  --glow-red-mid: rgba(255, 59, 48, 0.25);

  /* ===== WHITE INNER HIGHLIGHT (for emergency glow etc.) ===== */
  --inner-highlight: rgba(255, 255, 255, 0.2);
}

/* ===== LIGHT MODE (secondary) ===== */
.light {
  --background: #f2f2f7;
  --foreground: #1d1d1f;
  --card: rgba(255, 255, 255, 0.7);
  --card-foreground: #1d1d1f;
  --popover: rgba(255, 255, 255, 0.85);
  --popover-foreground: #1d1d1f;

  --primary: #007aff;
  --primary-foreground: #ffffff;
  --secondary: rgba(0, 0, 0, 0.05);
  --secondary-foreground: #1d1d1f;
  --muted: rgba(0, 0, 0, 0.03);
  --muted-foreground: #8e8e93;
  --accent: #007aff;
  --accent-foreground: #ffffff;
  --destructive: #ff3b30;
  --destructive-foreground: #ffffff;
  --success: #34c759;
  --warning: #ff9500;
  --border: rgba(0, 0, 0, 0.1);
  --input: rgba(0, 0, 0, 0.08);
  --ring: #007aff;

  --icon: #1d1d1f;
  --icon-muted: #8e8e93;

  --glass-bg: rgba(255, 255, 255, 0.65);
  --glass-bg-strong: rgba(255, 255, 255, 0.8);
  --glass-bg-light: rgba(255, 255, 255, 0.5);
  --glass-border: rgba(255, 255, 255, 0.8);
  --glass-border-subtle: rgba(0, 0, 0, 0.08);
  --glass-highlight: rgba(255, 255, 255, 0.9);
  --glass-shadow: rgba(0, 0, 0, 0.1);
  --glass-blur: 30px;

  --sidebar: rgba(242, 242, 247, 0.9);
  --sidebar-foreground: #1d1d1f;

  /* ===== DEVICE FRAME (same in light - physical device) ===== */
  --device-outer-bg: #1a1a1a;
  --device-frame-start: #2c2c2e;
  --device-frame-mid: #1c1c1e;
  --device-frame-end: #0d0d0d;
  --device-frame-border: rgba(255, 255, 255, 0.12);
  --device-frame-shadow1: rgba(0, 0, 0, 0.5);
  --device-frame-shadow2: rgba(0, 0, 0, 0.6);
  --device-frame-shadow3: rgba(0, 0, 0, 0.4);
  --device-frame-inner-highlight: rgba(255, 255, 255, 0.08);
  --device-metallic-highlight: rgba(255, 255, 255, 0.15);
  --device-metallic-mid: rgba(255, 255, 255, 0.02);
  --dynamic-island-bg: #000;
  --home-indicator: rgba(0, 0, 0, 0.3);

  /* ===== STATUS BAR ICONS (light mode) ===== */
  --signal-bars-color: #1d1d1f;
  --wifi-color: #1d1d1f;
  --battery-border: rgba(0, 0, 0, 0.35);
  --battery-cap: rgba(0, 0, 0, 0.35);
  --battery-level: #1d1d1f;

  /* ===== MESH GRADIENT COLORS (light mode - lighter tints) ===== */
  --mesh-purple: rgba(88, 86, 214, 0.2);
  --mesh-cyan: rgba(90, 200, 250, 0.15);
  --mesh-deep-purple: rgba(175, 82, 222, 0.12);
  --mesh-blue: rgba(0, 122, 255, 0.12);
  --mesh-additional1: rgba(52, 199, 89, 0.08);
  --mesh-additional2: rgba(255, 149, 0, 0.06);

  /* ===== GLASS INNER HIGHLIGHTS (light mode) ===== */
  --glass-edge-highlight: rgba(255, 255, 255, 0.8);
  --glass-edge-highlight-end: rgba(255, 255, 255, 0);
  --glass-specular-top: rgba(255, 255, 255, 0.6);
  --glass-specular-mid: rgba(255, 255, 255, 0.2);

  /* ===== DIVIDER & SEPARATOR (light mode) ===== */
  --divider-subtle: rgba(0, 0, 0, 0.06);
  --divider-light: rgba(0, 0, 0, 0.08);
  --divider-medium: rgba(0, 0, 0, 0.1);

  /* ===== CHART/GRAPH COLORS (light mode) ===== */
  --chart-grid: rgba(0, 0, 0, 0.08);
  --chart-target-line: rgba(255, 149, 0, 0.5);
  --chart-fill-start: rgba(0, 122, 255, 0.2);
  --chart-fill-end: rgba(0, 122, 255, 0);

  /* ===== NUMERIC KEYPAD (light mode) ===== */
  --keypad-btn-bg: rgba(0, 0, 0, 0.06);
  --keypad-btn-active: rgba(0, 0, 0, 0.12);
  --keypad-btn-text: #1d1d1f;

  /* ===== ON/OFF TOGGLE (light mode) ===== */
  --toggle-off: rgba(120, 120, 128, 0.32);
  --toggle-thumb: #fff;

  /* ===== TAB/SEGMENT CONTROL (light mode) ===== */
  --segment-bg: rgba(0, 0, 0, 0.06);
  --segment-active: rgba(255, 255, 255, 0.9);
  --segment-inactive-text: rgba(0, 0, 0, 0.5);

  /* ===== PROGRESS/TRACK COLORS (light mode) ===== */
  --track-bg: rgba(0, 0, 0, 0.08);
  --track-fill: var(--primary);

  /* ===== FAB ADD BUTTON (light mode) ===== */
  --fab-bg-start: #5ac8fa;
  --fab-bg-end: #007aff;

  /* ===== ALERT/WARNING BANNER (light mode) ===== */
  --alert-orange-bg: rgba(255, 149, 0, 0.1);
  --alert-orange-border: rgba(255, 149, 0, 0.25);
  --alert-red-bg: rgba(255, 59, 48, 0.1);

  <div class="device-frame">
    <div class="screen">

      <!-- Mesh Gradient Background -->
      <div class="mesh-bg"></div>

      <!-- Punch Hole Camera -->
      <div class="punch-hole-camera"></div>

      <!-- Main Content -->
      <div class="content">

        <!-- Page Title -->
        <h1 class="page-title">健康数据</h1>

        <!-- Time Filter Segmented Control -->
        <div class="time-filter">
          <div class="filter-seg" data-seg="day">日</div>
          <div class="filter-seg active" data-seg="week">周</div>
          <div class="filter-seg" data-seg="month">月</div>
          <div class="filter-seg" data-seg="year">年</div>
        </div>

        <!-- a. Ultrafiltration Trend Chart (Large Glass Card) -->
        <div class="card chart-card glass">
          <div class="chart-header">
            <div>
              <div class="card-title">超滤量趋势</div>
              <div class="card-subtitle">最近7天</div>
            </div>
            <div class="chart-average">
              <div class="avg-label">本周平均</div>
              <div><span class="avg-value">1,920</span><span class="avg-unit"> ml/天</span></div>
            </div>
          </div>

          <div class="chart-container">
            <svg viewBox="0 0 330 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="ufFill" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.35"/>
                  <stop offset="100%" stop-color="var(--primary)" stop-opacity="0.02"/>
                </linearGradient>
                <linearGradient id="ufLine" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="var(--primary)"/>
                  <stop offset="100%" stop-color="var(--accent)"/>
                </linearGradient>
                <filter id="ufGlow">
                  <feGaussianBlur stdDeviation="2.5" result="blur"/>
                  <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                  </feMerge>
                </filter>
              </defs>

              <!-- Grid lines (horizontal) -->
              <line x1="30" y1="30" x2="320" y2="30" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
              <line x1="30" y1="70" x2="320" y2="70" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
              <line x1="30" y1="110" x2="320" y2="110" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
              <line x1="30" y1="150" x2="320" y2="150" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

              <!-- Y-axis labels -->

              <text x="2" y="74" fill="rgba(255,255,255,0.35)" font-size="9" font-family="SF Mono, ui-monospace, monospace" text-anchor="start">2000</text>
              <text x="2" y="114" fill="rgba(255,255,255,0.35)" font-size="9" font-family="SF Mono, ui-monospace, monospace" text-anchor="start">1500</text>
              <text x="2" y="154" fill="rgba(255,255,255,0.35)" font-size="9" font-family="SF Mono, ui-monospace, monospace" text-anchor="start">1000</text>

              <!-- Target line (dashed 2500ml) -->
              <line x1="30" y1="30" x2="320" y2="30" stroke="rgba(255,149,0,0.5)" stroke-width="1.2" stroke-dasharray="5,4"/>
              <text x="322" y="34" fill="rgba(255,149,0,0.7)" font-size="9" font-family="SF Pro Display, sans-serif">目标</text>

              <!-- Data: Mon 1800, Tue 2100, Wed 1950, Thu 2200, Fri 1650, Sat 2050, Sun 1850
                   Y mapping: 1000ml->150px, 2500ml->30px => scale = (150-30)/(1000-2500) = -0.08 per ml
                   y = 150 - (val-1000)*0.08
                   Mon 1800: y=150-800*0.08=86
                   Tue 2100: y=150-1100*0.08=62
                   Wed 1950: y=150-950*0.08=74
                   Thu 2200: y=150-1200*0.08=54
                   Fri 1650: y=150-650*0.08=98
                   Sat 2050: y=150-1050*0.08=66
                   Sun 1850: y=150-850*0.08=82
                   X positions: 7 points across 30..320 => step = 290/6 ≈ 48.3
                   x: 30, 78.3, 126.7, 175, 223.3, 271.7, 320 -->

              <!-- Fill area -->
              <path d="M30,86 L78.3,62 L126.7,74 L175,54 L223.3,98 L271.7,66 L320,82 L320,150 L30,150 Z"

                        filter="url(#ufGlow)"/>

              <!-- Data points -->

              <circle cx="78.3" cy="62" r="4" fill="#5ac8fa" stroke="#fff" stroke-width="1.5"/>
              <circle cx="126.7" cy="74" r="4" fill="#5ac8fa" stroke="#fff" stroke-width="1.5"/>
              <circle cx="175" cy="54" r="4" fill="#5ac8fa" stroke="#fff" stroke-width="1.5"/>
              <circle cx="223.3" cy="98" r="4" fill="#5ac8fa" stroke="#fff" stroke-width="1.5"/>
              <circle cx="271.7" cy="66" r="4" fill="#5ac8fa" stroke="#fff" stroke-width="1.5"/>
              <circle cx="320" cy="82" r="4.5" fill="#5ac8fa" stroke="#fff" stroke-width="2" class="data-point-pulse"/>

              <!-- X-axis day labels -->
              <text x="30" y="170" fill="rgba(255,255,255,0.4)" font-size="10" font-family="SF Pro Display, sans-serif" text-anchor="middle">一</text>

  <script>
    // Time filter segmented control interaction
    document.querySelectorAll('.filter-seg').forEach(seg => {
      seg.addEventListener('click', function() {
        document.querySelectorAll('.filter-seg').forEach(s => s.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // Navigation bar interaction
    const navBar = document.querySelector('.nav-bar');
    const navClasses = ['nav-home-active', 'nav-record-active', 'nav-data-active', 'nav-meds-active', 'nav-reminders-active'];
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', function() {
        navClasses.forEach(c => navBar.classList.remove(c));
        const key = this.getAttribute('data-nav-key');
        navBar.classList.add('nav-' + key + '-active');
        const indicator = this.querySelector('.nav-indicator');
        indicator.style.animation = 'none';
        indicator.offsetHeight;
        indicator.style.animation = 'navBounce 0.5s cubic-bezier(0.32, 0.72, 0, 1)';
      });
    });

    // Card button interactions
    document.querySelectorAll('.warning-action-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
      });
    });
  </script>


    <style>
    /* ===== Base Reset ===== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      height: 100%;
    }

    body {
      width: 100%;
      min-height: 100%;
      overflow-y: auto;
      padding: 40px 20px;
      font-family: var(--font-sans);
      background: var(--device-outer-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== Device Frame ===== */
    .device-frame {
      position: relative;
      width: 422px;
      height: 882px;
      background: linear-gradient(145deg, var(--device-frame-start), var(--device-frame-mid) 40%, var(--device-frame-end));
      border-radius: 52px;
      border: 1px solid var(--device-frame-border);
      box-shadow:
        0 0 0 2px var(--device-frame-shadow1),
        0 25px 60px var(--device-frame-shadow2),
        0 8px 20px var(--device-frame-shadow3),
        inset 0 1px 0 var(--device-frame-inner-highlight);
      padding: 16px;
      flex-shrink: 0;
    }

    .device-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 52px;
      background: linear-gradient(
        160deg,
        var(--device-metallic-highlight) 0%,
        var(--device-metallic-mid) 20%,
        transparent 40%
      );
      pointer-events: none;
    }

    /* ===== Screen ===== */
    .screen {
      position: relative;
      width: 390px;
      height: 840px;
      border-radius: 44px;
      contain: paint;
      background: var(--background);
    }

    /* ===== Mesh Gradient Background ===== */
    .mesh-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 320px 300px at 10% 90%, var(--mesh-purple) 0%, transparent 70%),
        radial-gradient(ellipse 280px 260px at 50% 5%, var(--mesh-cyan) 0%, transparent 70%),
        radial-gradient(ellipse 300px 280px at 90% 85%, var(--mesh-deep-purple) 0%, transparent 70%),
        radial-gradient(ellipse 260px 240px at 95% 10%, var(--mesh-blue) 0%, transparent 70%),
        radial-gradient(ellipse 200px 200px at 20% 40%, var(--mesh-cyan-extra) 0%, transparent 70%),
        var(--background);
    }

    /* ===== Punch Hole Camera ===== */
    .punch-hole-camera {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #000;
      box-shadow: inset 0 0 2px rgba(255,255,255,0.1);
      z-index: 100;
    }

    /* ===== Glass Material Classes ===== */
    .glass {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      border: 1px solid var(--glass-bg-strong);
      box-shadow: 0 8px 32px var(--glass-shadow), inset 0 1px 0 var(--glass-specular-top);
    }
    .glass-strong {
      position: relative;
      background: var(--glass-bg-strong);
      backdrop-filter: blur(var(--glass-blur-strong)) saturate(2);
      -webkit-backdrop-filter: blur(var(--glass-blur-strong)) saturate(2);
      border: 1px solid var(--glass-specular-top);
      box-shadow: 0 12px 40px var(--glass-strong-shadow), inset 0 1px 0 var(--home-indicator);
    }

    /* Specular highlight for glass */
    .glass::after, .glass-strong::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      border-radius: inherit;
      background: linear-gradient(
        180deg,
        var(--glass-bg) 0%,
        var(--glass-specular-mid-low) 50%,
        transparent 100%
      );
      pointer-events: none;
    }

    /* ===== Content Area ===== */
    .content {
      position: absolute;
      inset: 0;
      padding: 44px 20px 72px;
      overflow-y: auto;
      overflow-x: clip;
      scrollbar-width: none;
      z-index: 10;
    }
    .content::-webkit-scrollbar { display: none; }

    /* ===== Page Title ===== */
    .page-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--foreground);
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    /* ===== Time Filter Segmented Control ===== */
    .time-filter {
      display: flex;
      background: var(--segment-bg);
      border-radius: 9999px;
      padding: 3px;
      margin-bottom: 20px;
      position: relative;
    }

    .time-filter .filter-seg {
      flex: 1;
      text-align: center;
      padding: 7px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-400);
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      position: relative;
      z-index: 2;
      letter-spacing: -0.01em;
    }

    .time-filter .filter-seg.active {
      color: var(--primary-foreground);
      background: var(--tint-cyan-strong);
      box-shadow: 0 2px 8px var(--shadow-xs-rgba);
    }

    .time-filter .filter-seg:active {
      transform: scale(0.96);
    }

    /* ===== Card Base ===== */
    .card {
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .card-interactive {
      transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1), background 0.2s ease;
      cursor: pointer;
    }
    .card-interactive:active {
      transform: scale(0.98);
      background: var(--card-active-bg);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--foreground);
      letter-spacing: -0.02em;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--text-400);
      margin-top: 2px;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* ===== Ultrafiltration Trend Chart Card ===== */
    .chart-card {
      padding: 18px;
    }

    .chart-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .chart-average {
      text-align: right;
    }

    .chart-average .avg-label {
      font-size: 11px;
      color: var(--text-400);
      margin-bottom: 2px;
    }

    .chart-average .avg-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--medical-cyan);
      font-family: var(--font-mono);
      letter-spacing: -0.02em;
    }

    .chart-average .avg-unit {
      font-size: 12px;
      color: var(--text-400);
      font-weight: 500;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 180px;
      margin-top: 4px;
    }

    .chart-container svg {
      width: 100%;
      height: 100%;
    }

    .chart-compliance {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--medical-green);
      font-weight: 500;
    }

    .chart-compliance .dot {
      width: 7px;
      height: 7px;
      background: var(--medical-green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--tint-green-glow-strong);
    }

    /* Pulse animation for data points */
    @keyframes pointPulse {
      0%, 100% { r: 4; opacity: 1; }
      50% { r: 5.5; opacity: 0.8; }
    }

    .data-point-pulse {
      animation: pointPulse 2s ease-in-out infinite;
    }

    /* ===== BP/HR Card ===== */
    .bp-hr-card {
      display: flex;
      gap: 0;
      padding: 0;
      overflow: hidden;
    }

    .bp-section, .hr-section {
      flex: 1;
      padding: 16px;
      position: relative;
    }

    .bp-section {
      border-right: 1px solid var(--divider-light);
    }

    .vital-label {
      font-size: 12px;
      color: var(--text-400);
      font-weight: 500;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .vital-label-icon {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vital-big-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--foreground);
      font-family: var(--font-mono);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .vital-unit-small {
      font-size: 11px;
      color: var(--text-400);
      margin-top: 2px;
    }

    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      margin-top: 8px;
    }

    .status-tag.green {
      background: var(--tint-green-strong);
      color: var(--medical-green);
    }

    .status-tag.orange {
      background: var(--alert-orange-bg);
      color: var(--medical-orange);
    }

    .status-tag .tag-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    .status-tag.green .tag-dot { background: var(--medical-green); }
    .status-tag.orange .tag-dot { background: var(--medical-orange); }

    /* Mini bar chart for BP */
    .mini-bars {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 36px;
      margin-top: 10px;
    }

    .mini-bar {
      flex: 1;
      border-radius: 3px 3px 1px 1px;
      background: linear-gradient(180deg, var(--tint-cyan-bar), var(--tint-cyan-md));
      position: relative;
    }

    .mini-bar.latest {
      background: linear-gradient(180deg, var(--medical-cyan), var(--tint-cyan-glow));
      box-shadow: 0 0 8px var(--tint-cyan-glow);
    }

    /* Mini line chart for HR */
    .mini-line-chart {
      margin-top: 10px;
      height: 36px;
    }

    .mini-line-chart svg {
      width: 100%;
      height: 100%;
    }

    /* ===== Electrolyte Grid (2x2) ===== */
    .electrolyte-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .electrolyte-card {
      border-radius: 20px;
      padding: 14px;
      position: relative;
      overflow: hidden;
    }

    .electrolyte-name {
      font-size: 12px;
      color: var(--text-400);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 6px;
    }

    .electrolyte-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--foreground);
      font-family: var(--font-mono);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .electrolyte-unit {
      font-size: 11px;
      color: var(--text-400);
      margin-top: 1px;
    }

    .electrolyte-value.abnormal {
      color: var(--medical-orange);
    }

    /* Mini range progress bar */
    .range-bar {
      position: relative;
      height: 4px;
      background: var(--track-bg);
      border-radius: 2px;
      margin-top: 10px;
    }

    .range-bar .range-fill {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 2px;
    }

    .range-bar .range-fill.normal {
      background: linear-gradient(90deg, var(--tint-green-bar-start), var(--tint-green-bar-end));
    }

    .range-bar .range-fill.warning {
      background: linear-gradient(90deg, var(--tint-orange-bar-start), var(--medical-orange));
    }

    .range-bar .range-indicator {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--primary-foreground);
      box-shadow: 0 2px 4px var(--shadow-xs-rgba);
    }

    .range-bar .range-indicator.normal {
      background: var(--medical-green);
    }

    .range-bar .range-indicator.warning {
      background: var(--medical-orange);
      box-shadow: 0 0 8px var(--tint-orange-glow-dot);
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 10px;
      color: var(--text-400);
      font-family: var(--font-mono);
    }

    /* Warning badge for abnormal */
    .warning-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--tint-orange-icon);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== Weight Card ===== */
    .weight-card .weight-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .weight-current .weight-label {
      font-size: 12px;
      color: var(--text-400);
      margin-bottom: 4px;
    }

    .weight-current .weight-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--foreground);
      font-family: var(--font-mono);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .weight-current .weight-unit {
      font-size: 14px;
      color: var(--text-400);
      font-weight: 500;
      margin-left: 2px;
    }

    .weight-target {
      text-align: right;
    }

    .weight-target .target-label {
      font-size: 11px;
      color: var(--text-400);
    }

    .weight-target .target-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--medical-cyan);
      font-family: var(--font-mono);
    }

    /* Weight progress bar */
    .weight-progress {
      position: relative;
      height: 8px;
      background: var(--track-bg);
      border-radius: 4px;
      margin-bottom: 6px;
      overflow: visible;
    }

    .weight-progress .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--medical-cyan), var(--medical-blue));
      box-shadow: 0 0 10px var(--tint-cyan-glow);
    }

    .weight-progress .progress-target-marker {
      position: absolute;
      top: -3px;
      width: 2px;
      height: 14px;
      background: var(--medical-green);
      border-radius: 1px;
      box-shadow: 0 0 4px var(--tint-green-glow-strong);
    }

    .weight-progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-400);
      font-family: var(--font-mono);
    }

    .weight-mini-chart {
      margin-top: 12px;
      height: 40px;
    }

    .weight-mini-chart svg {
      width: 100%;
      height: 100%;
    }

    /* ===== Warning Banner ===== */
    .warning-banner {
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      background: var(--tint-orange-bg);
      backdrop-filter: blur(30px) saturate(1.8);
      -webkit-backdrop-filter: blur(30px) saturate(1.8);
      border: 1px solid var(--tint-orange-border);
      box-shadow: 0 0 20px var(--tint-orange-glow), inset 0 1px 0 var(--divider-medium);
      position: relative;
      overflow: hidden;
    }

    .warning-banner::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      border-radius: inherit;
      background: linear-gradient(180deg, var(--divider-light) 0%, transparent 100%);
      pointer-events: none;
    }

    .warning-icon-wrap {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--tint-orange-icon);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .warning-text {
      flex: 1;
      font-size: 13px;
      color: var(--foreground);
      font-weight: 500;
      line-height: 1.4;
    }

    .warning-text strong {
      color: var(--medical-orange);
      font-weight: 600;
    }

    .warning-action-btn {
      padding: 6px 14px;
      border-radius: 9999px;
      background: var(--tint-orange-btn);
      border: 1px solid var(--tint-orange-border-strong);
      color: var(--medical-orange);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.32, 0.72, 0, 1);
      font-family: var(--font-sans);
      flex-shrink: 0;
    }

    .warning-action-btn:active {
      transform: scale(0.95);
      background: var(--tint-orange-active);
    }

    /* ===== Export/Share Row ===== */
    .export-row {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    .export-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--foreground);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .export-btn:active {
      transform: scale(0.97);
      background: var(--glass-bg-strong);
    }

    .export-btn svg {
      width: 18px;
      height: 18px;
    }

    /* ===== Floating Navigation Bar ===== */
    .nav-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 56px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
      z-index: 50;
      /* 液态玻璃 - 极低不透明度，让模糊效果更明显 */
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(30px) saturate(1.8);
      -webkit-backdrop-filter: blur(30px) saturate(1.8);
      border: 0.5px solid rgba(255, 255, 255, 0.2);
      box-shadow: 
        0 4px 24px rgba(0, 0, 0, 0.2),
        0 1px 2px rgba(0, 0, 0, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        inset 0 -0.5px 0 rgba(255, 255, 255, 0.08);
    }

    .nav-bar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 50%;
      border-radius: 28px 28px 50% 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.02) 80%);
      pointer-events: none;
    }

    .nav-blur-fade {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 76px;
      background: linear-gradient(to top, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.05) 40%, transparent 70%);
      pointer-events: none;
      z-index: 49;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .nav-item:active { transform: scale(0.9); }

    .nav-home-active .nav-item[data-nav-key="home"] .nav-icon,
    .nav-record-active .nav-item[data-nav-key="record"] .nav-icon,
    .nav-data-active .nav-item[data-nav-key="data"] .nav-icon,
    .nav-meds-active .nav-item[data-nav-key="meds"] .nav-icon,
    .nav-reminders-active .nav-item[data-nav-key="reminders"] .nav-icon {
      color: var(--medical-cyan);
    }

    .nav-item .nav-icon {
      width: 24px;
      height: 24px;
      color: var(--text-400);
      transition: color 0.3s ease;
    }

    .nav-item .nav-icon svg { width: 100%; height: 100%; }

    .nav-home-active .nav-item[data-nav-key="home"] .nav-indicator,
    .nav-record-active .nav-item[data-nav-key="record"] .nav-indicator,
    .nav-data-active .nav-item[data-nav-key="data"] .nav-indicator,
    .nav-meds-active .nav-item[data-nav-key="meds"] .nav-indicator,
    .nav-reminders-active .nav-item[data-nav-key="reminders"] .nav-indicator {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .nav-indicator {
      position: absolute;
      bottom: 4px;
      width: 18px;
      height: 4px;
      background: var(--medical-cyan);
      border-radius: 2px;
      opacity: 0;
      transform: translateY(4px) scale(0.5);
      transition: all 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      animation: navBounce 0.5s cubic-bezier(0.32, 0.72, 0, 1);
    }

    @keyframes navBounce {
      0% { transform: translateY(6px) scale(0.3); opacity: 0; }
      50% { transform: translateY(-2px) scale(1.1); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

  </style>
</body>
</html>
