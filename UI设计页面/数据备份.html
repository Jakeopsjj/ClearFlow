  @theme inline {

<body>
  <div class="device-frame">
    <div class="screen">
      <div class="mesh-bg"></div>
      <div class="punch-hole-camera"></div>

      <div class="content">
        <!-- Page Navigation -->
        <div class="page-nav">
          <button class="back-btn" id="btn-back-settings" onclick="window.location.href='settings.html'">
            <svg viewBox="0 0 20 20" fill="none"><path d="M12 5l-5 5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>设置</span>
          </button>
          <h1 class="page-nav-title">数据备份</h1>
          <div class="page-nav-right"></div>
        </div>

        <!-- Backup Status Card -->
        <div class="backup-status-card glass">
          <div class="backup-cloud-icon">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 42c-5.5 0-10-4.5-10-10s4.5-10 10-10c1.5 0 3 .3 4.3 1C26 17 30.5 14 36 14c7.5 0 13.7 5.8 14 13.2 4 .8 7 4.3 7 8.3 0 4.7-3.8 8.5-8.5 8.5H20z" stroke="#5ac8fa" stroke-width="2.5" stroke-linejoin="round" fill="rgba(90,200,250,0.1)"/>
              <path d="M32 24v14M26 30l6-6 6 6" stroke="#5ac8fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="backup-status-title">所有数据已备份</div>
          <div class="backup-status-subtitle">上次备份：今天 08:30</div>
          <div class="backup-progress-ring">
            <svg viewBox="0 0 40 40">
              <circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
              <circle cx="20" cy="20" r="16" fill="none" stroke="#34c759" stroke-width="3" stroke-linecap="round"
                stroke-dasharray="100.5" stroke-dashoffset="0" transform="rotate(-90 20 20)"/>
            </svg>
            <div class="backup-progress-text">100%</div>
          </div>
          <div class="backup-action-btns">
            <button class="backup-btn-primary">立即备份</button>
            <button class="backup-btn-secondary glass">备份设置</button>
          </div>
        </div>

        <!-- Section: 备份设置 -->
        <div class="settings-section">
          <div class="section-header">备份设置</div>
          <div class="settings-card">
            <div class="setting-item">
              <div class="setting-label">自动备份</div>
              <label class="toggle"><input type="checkbox" checked><div class="toggle-track"></div><div class="toggle-thumb"></div></label>
            </div>
            <div class="setting-item">
              <div class="setting-label">备份频率</div>
              <div class="setting-value">每天</div>
              <div class="setting-chevron"><svg viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            </div>
            <div class="setting-item">
              <div class="setting-label">仅Wi-Fi备份</div>
              <label class="toggle"><input type="checkbox" checked><div class="toggle-track"></div><div class="toggle-thumb"></div></label>
            </div>
            <div class="setting-item">
              <div class="setting-label">备份内容</div>
              <div class="setting-value">全部数据</div>
              <div class="setting-chevron"><svg viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            </div>
            <div class="setting-item">
              <div class="setting-label-group">
                <div class="setting-label">备份加密</div>
                <div class="setting-sublabel">端到端加密保护</div>
              </div>
              <label class="toggle"><input type="checkbox" checked><div class="toggle-track"></div><div class="toggle-thumb"></div></label>
            </div>
          </div>
        </div>

        <!-- Section: 备份历史 -->
        <div class="settings-section">
          <div class="section-header">备份历史</div>
          <div class="settings-card">
            <div class="history-item">
              <div class="history-info">
                <div class="history-date">今天 08:30</div>
                <div class="history-size">2.4 MB</div>
              </div>
              <div class="history-status success">
                <svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>成功</span>
              </div>
            </div>
            <div class="history-item">
              <div class="history-info">
                <div class="history-date">昨天 08:30</div>
                <div class="history-size">2.3 MB</div>
              </div>
              <div class="history-status success">
                <svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>成功</span>
              </div>
            </div>
            <div class="history-item">
              <div class="history-info">
                <div class="history-date">8月2日 08:30</div>
                <div class="history-size">2.3 MB</div>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; }
    body {

      position: relative; width: 422px; height: 882px;

      border-radius: 52px; border: 1px solid var(--device-frame-border);
      box-shadow: 0 0 0 2px var(--device-frame-shadow1), 0 25px 60px var(--device-frame-shadow2),

      padding: 16px; flex-shrink: 0;
    }
    .device-frame::before {
      content: ''; position: absolute; inset: 0; border-radius: 52px;

      pointer-events: none;

    .screen { position: relative; width: 390px; height: 840px; border-radius: 44px; contain: paint; background: var(--background); }
    .mesh-bg {

                  radial-gradient(ellipse 280px 260px at 50% 5%, var(--mesh-cyan) 0%, transparent 70%),
                  radial-gradient(ellipse 300px 280px at 90% 85%, var(--mesh-deep-purple) 0%, transparent 70%),
                  radial-gradient(ellipse 260px 240px at 95% 10%, var(--mesh-blue) 0%, transparent 70%),
                  radial-gradient(ellipse 200px 200px at 20% 40%, var(--mesh-cyan-extra) 0%, transparent 70%),
                  var(--background);

    .punch-hole-camera {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);

      box-shadow: inset 0 0 2px rgba(255,255,255,0.1);

    .glass {
      background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      border: 0.5px solid var(--glass-border-subtle);
      box-shadow: 0 4px 20px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .glass-strong {
      background: var(--glass-bg-strong); backdrop-filter: blur(var(--glass-blur-strong)) saturate(2);

      box-shadow: 0 12px 40px var(--glass-strong-shadow), inset 0 1px 0 var(--home-indicator);

    .setting-item.danger-center .setting-label { color: var(--medical-red); text-align: center; flex: none; }

    /* Toggle */
    .toggle { position: relative; width: 51px; height: 31px; flex-shrink: 0; cursor: pointer; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute; inset: 0; border-radius: 9999px; background: var(--toggle-off);
      transition: background 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .toggle-thumb {
      position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
      background: var(--toggle-thumb);
      box-shadow: 0 3px 8px var(--shadow), 0 1px 2px var(--shadow-sm);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .toggle input:checked ~ .toggle-track { background: var(--medical-green); }
    .toggle input:checked ~ .toggle-thumb { transform: translateX(20px); }
    .toggle:active .toggle-thumb { width: 33px; border-radius: 16px; }
    .toggle input:checked:active ~ .toggle-thumb { transform: translateX(14px); }

    /* History Items */
    .history-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; position: relative;
    }
    .history-item + .history-item { border-top: 0.5px solid rgba(255,255,255,0.08); }
    .history-info { display: flex; flex-direction: column; gap: 2px; }
    .history-date { font-size: 15px; color: var(--foreground); }

    /* Nav */
    .nav-no-active .nav-item { color: rgba(255,255,255,0.6); }

    .nav-bar {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      width: 280px; height: 56px; border-radius: 28px;
      display: flex; align-items: center; justify-content: space-around; padding: 0 8px; z-index: 50;

      backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8);

      box-shadow: 0 4px 24px rgba(0,0,0,0.2), 0 1px 2px rgba(0,0,0,0.1),

    .nav-bar::before {
      content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 50%;
      border-radius: 28px 28px 50% 50%;

      pointer-events: none;
    }
    .nav-blur-fade {
      position: absolute; bottom: 0; left: 0; right: 0; height: 76px;

      pointer-events: none; z-index: 49;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;

      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);

    .nav-item:active { transform: scale(0.9); }
