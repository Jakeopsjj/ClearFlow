  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; }
    body {
      min-height: 100%; overflow-y: auto; padding: 40px 20px;
      font-family: var(--font-sans); background: var(--device-outer-bg);
      display: flex; align-items: center; justify-content: center;
    }
    .device-frame {
      position: relative; width: 422px; height: 882px;
      background: linear-gradient(145deg, var(--device-frame-start), var(--device-frame-mid) 40%, var(--device-frame-end));
      border-radius: 52px; border: 1px solid var(--device-frame-border);
      box-shadow: 0 0 0 2px var(--device-frame-shadow1), 0 25px 60px var(--device-frame-shadow2),
                  0 8px 20px var(--device-frame-shadow3), inset 0 1px 0 var(--device-frame-inner-highlight);
      padding: 16px; flex-shrink: 0;
    }
    .device-frame::before {
      content: ''; position: absolute; inset: 0; border-radius: 52px;
      background: linear-gradient(160deg, var(--device-metallic-highlight) 0%, var(--device-metallic-mid) 20%, transparent 40%);
      pointer-events: none;
    }
    .screen { position: relative; width: 390px; height: 840px; border-radius: 44px; contain: paint; background: var(--background); }
    .mesh-bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 320px 300px at 10% 90%, var(--mesh-purple) 0%, transparent 70%),
                  radial-gradient(ellipse 280px 260px at 50% 5%, var(--mesh-cyan) 0%, transparent 70%),
                  radial-gradient(ellipse 300px 280px at 90% 85%, var(--mesh-deep-purple) 0%, transparent 70%),
                  radial-gradient(ellipse 260px 240px at 95% 10%, var(--mesh-blue) 0%, transparent 70%),
                  radial-gradient(ellipse 200px 200px at 20% 40%, var(--mesh-cyan-extra) 0%, transparent 70%),
                  var(--background);
    }
    .punch-hole-camera {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 12px; height: 12px; border-radius: 50%; background: #000; z-index: 100;
      box-shadow: inset 0 0 2px rgba(255,255,255,0.1);
    }
    .glass-strong {
      background: var(--glass-bg-strong); backdrop-filter: blur(var(--glass-blur-strong)) saturate(2);
      -webkit-backdrop-filter: blur(var(--glass-blur-strong)) saturate(2);
      border: 1px solid var(--glass-specular-top);
      box-shadow: 0 12px 40px var(--glass-strong-shadow), inset 0 1px 0 var(--home-indicator);
    }
    .content {
      position: absolute; inset: 0; padding: 44px 20px 72px;
      overflow-y: auto; overflow-x: clip; scrollbar-width: none; z-index: 10;
    }
    .content::-webkit-scrollbar { display: none; }

    /* Page Nav */
    .page-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding-top: 4px; position: relative;
    }
    .back-btn {
      display: flex; align-items: center; gap: 4px; background: none; border: none;
      color: var(--medical-cyan); font-size: 17px; cursor: pointer;
      padding: 4px 8px 4px 0; font-family: var(--font-sans);
    }
    .back-btn svg { width: 20px; height: 20px; }
    .page-nav-title {
      font-size: 17px; font-weight: 600; color: var(--foreground);
      position: absolute; left: 50%; transform: translateX(-50%); letter-spacing: -0.02em;
    }
    .page-nav-right { width: 60px; }

    /* Strong Reminder Card */
    .strong-reminder-card {
      display: flex; align-items: center; gap: 14px;
      padding: 18px 16px; border-radius: 20px; margin-bottom: 28px;
      background: rgba(255, 149, 0, 0.08);
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      border: 1px solid rgba(255, 149, 0, 0.3);
      box-shadow: 0 4px 24px rgba(255,149,0,0.15), inset 0 1px 0 rgba(255,255,255,0.1);
      position: relative; overflow: hidden;
    }
    .strong-reminder-card::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 60%);
      pointer-events: none;
    }
    .strong-reminder-icon { flex-shrink: 0; }
    .strong-reminder-icon svg { width: 40px; height: 40px; }
    .strong-reminder-text { flex: 1; }
    .strong-reminder-title {
      font-size: 18px; font-weight: 700; color: var(--foreground);
      letter-spacing: -0.02em; margin-bottom: 2px;
    }
    .strong-reminder-desc {
      font-size: 13px; color: var(--text-400); line-height: 1.4;
    }

    /* Settings Sections */
    .settings-section { margin-bottom: 28px; }
    .section-header {
      font-size: 13px; font-weight: 600; color: var(--text-400);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; padding-left: 12px;
    }
    .settings-card {
      background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
      border: 0.5px solid var(--glass-border-subtle); border-radius: 16px;
      overflow: hidden; box-shadow: 0 4px 20px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.12);
      position: relative;
    }
    .settings-card::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
      border-radius: inherit; background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 60%);
      pointer-events: none;
    }
    .setting-item {
      display: flex; align-items: center; padding: 12px 16px;
      cursor: pointer; transition: background 0.15s ease; gap: 12px; position: relative;
    }
    .setting-item:active { background: rgba(255,255,255,0.08); }
    .setting-item + .setting-item { border-top: 0.5px solid rgba(255,255,255,0.08); }
    .setting-label {
      flex: 1; font-size: 16px; color: var(--foreground); letter-spacing: -0.01em;
    }
    .setting-label-group { flex: 1; }
    .setting-label-group .setting-label { font-size: 16px; }
    .setting-sublabel { font-size: 13px; color: var(--text-400); margin-top: 1px; }
    .setting-value { font-size: 15px; color: var(--text-400); margin-right: 4px; }
    .setting-chevron { color: var(--text-400); opacity: 0.6; flex-shrink: 0; }
    .setting-chevron svg { width: 14px; height: 14px; }
    .warning-text { color: var(--medical-red) !important; }
    .warning-sub { color: rgba(255,59,48,0.7); }
    .accent-sub { color: var(--medical-orange); }

    /* Toggle */
    .toggle { position: relative; width: 51px; height: 31px; flex-shrink: 0; cursor: pointer; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute; inset: 0; border-radius: 9999px; background: var(--toggle-off);
      transition: background 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .toggle-thumb {
      position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
      background: var(--toggle-thumb);
      box-shadow: 0 3px 8px var(--shadow), 0 1px 2px var(--shadow-sm);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .toggle input:checked ~ .toggle-track { background: var(--medical-green); }
    .toggle input:checked ~ .toggle-thumb { transform: translateX(20px); }
    .toggle:active .toggle-thumb { width: 33px; border-radius: 16px; }
    .toggle input:checked:active ~ .toggle-thumb { transform: translateX(14px); }

    /* Orange Toggle for strong reminder */
    .toggle-orange input:checked ~ .toggle-track { background: var(--medical-orange); }
    .toggle-large { width: 56px; height: 34px; }
    .toggle-large .toggle-thumb {
      width: 30px; height: 30px;
      box-shadow: 0 4px 10px rgba(255,149,0,0.3), 0 2px 4px rgba(0,0,0,0.2);
    }
    .toggle-large input:checked ~ .toggle-thumb { transform: translateX(22px); }
    .toggle-large:active .toggle-thumb { width: 36px; border-radius: 18px; }
    .toggle-large input:checked:active ~ .toggle-thumb { transform: translateX(16px); }

    /* Nav */
    .nav-no-active .nav-item { color: rgba(255,255,255,0.6); }
    .nav-no-active .nav-indicator { display: none; }
    .nav-no-active .nav-item .nav-icon { color: rgba(255,255,255,0.6); }
    .nav-bar {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      width: 280px; height: 56px; border-radius: 28px;
      display: flex; align-items: center; justify-content: space-around; padding: 0 8px; z-index: 50;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8);
      border: 0.5px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 24px rgba(0,0,0,0.2), 0 1px 2px rgba(0,0,0,0.1),
                  inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -0.5px 0 rgba(255,255,255,0.08);
    }
    .nav-bar::before {
      content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 50%;
      border-radius: 28px 28px 50% 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.02) 80%);
      pointer-events: none;
    }
    .nav-blur-fade {
      position: absolute; bottom: 0; left: 0; right: 0; height: 76px;
      background: linear-gradient(to top, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.05) 40%, transparent 70%);
      pointer-events: none; z-index: 49;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 48px; height: 48px; border-radius: 50%; cursor: pointer; position: relative;
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .nav-item:active { transform: scale(0.9); }
    .nav-item .nav-icon { width: 24px; height: 24px; color: var(--text-400); transition: color 0.3s ease; }
    .nav-item .nav-icon svg { width: 100%; height: 100%; }
    .nav-indicator {
      position: absolute; bottom: 4px; width: 18px; height: 4px;
      background: var(--medical-cyan); border-radius: 2px;
      opacity: 0; transform: translateY(4px) scale(0.5);
    }
  </style>
</body>
</html>
