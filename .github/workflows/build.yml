name: Build APK

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Build Release APK
        env:
          CLEARDU_RELEASE_KEYSTORE_BASE64: ${{ secrets.CLEARDU_RELEASE_KEYSTORE_BASE64 }}
          CLEARDU_RELEASE_STORE_PASSWORD: ${{ secrets.CLEARDU_RELEASE_STORE_PASSWORD }}
          CLEARDU_RELEASE_KEY_ALIAS: ${{ secrets.CLEARDU_RELEASE_KEY_ALIAS }}
          CLEARDU_RELEASE_KEY_PASSWORD: ${{ secrets.CLEARDU_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --build-cache

      - name: Collect APK Info
        id: apk
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "debug_apk=$DEBUG_APK" >> $GITHUB_OUTPUT
          echo "release_apk=$RELEASE_APK" >> $GITHUB_OUTPUT
          echo "debug_size=$(du -sh "$DEBUG_APK" | cut -f1)" >> $GITHUB_OUTPUT
          echo "release_size=$(du -sh "$RELEASE_APK" | cut -f1)" >> $GITHUB_OUTPUT
          echo "debug_sha=$(sha256sum "$DEBUG_APK" | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "release_sha=$(sha256sum "$RELEASE_APK" | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ steps.apk.outputs.debug_apk }}
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.release_apk }}
          retention-days: 7

      - name: Build Summary
        run: |
          echo "### APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Variant | Size | SHA256 |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Debug   | ${{ steps.apk.outputs.debug_size }} | \`${{ steps.apk.outputs.debug_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | ${{ steps.apk.outputs.release_size }} | \`${{ steps.apk.outputs.release_sha }}\` |" >> $GITHUB_STEP_SUMMARY
